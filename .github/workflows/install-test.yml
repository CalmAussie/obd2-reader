name: Install test

# Checks that the APK people download installs and runs on a clean phone, with nothing else
# needed: it downloads the latest release exactly as a user would, installs it on fresh
# emulators from Android 8 to Android 15, opens it, starts the demo car and visits every tab.
# Runs after every release, and on demand from the Actions tab or a push to the qa branch.
on:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [qa]
    paths-ignore: ["qa-reports/**"]

permissions:
  contents: write

jobs:
  install:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 33, 35, 36, 37]
        include:
          # Android 17's image is named "android-37.0", and its x86_64 image uses 16 KB memory pages.
          - api: 37
            level: "37.0"
            target: google_apis_ps16k
    steps:
      - uses: actions/checkout@v5
      - name: Download the published APK, as a user would
        run: |
          curl -fsSL -o OBD2Reader.apk https://github.com/${{ github.repository }}/releases/latest/download/OBD2Reader.apk
          ls -l OBD2Reader.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install and run on Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.level || matrix.api }}
          target: ${{ matrix.target || 'google_apis' }}
          arch: x86_64
          profile: pixel_6
          # Newer system images leave too little room for apps on the default disk.
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/install-test.sh ${{ matrix.api }}
      - name: Summary
        if: always()
        run: |
          echo "### Android API ${{ matrix.api }}" >> "$GITHUB_STEP_SUMMARY"
          cat reports/api-${{ matrix.api }}/result.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no result" >> "$GITHUB_STEP_SUMMARY"
          while read -r line; do echo "::notice title=API ${{ matrix.api }}::$line"; done < reports/api-${{ matrix.api }}/result.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-test-api-${{ matrix.api }}
          path: reports/

  # Screenshots and results go to the install-test-reports branch, so they can be looked at without signing in.
  publish:
    needs: install
    if: always() && needs.install.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: reports
          merge-multiple: true
      - name: Commit reports
        run: |
          cd reports
          git init -q && git checkout -q -b install-test-reports
          git config user.name "install-test-bot"; git config user.email "install-test-bot@users.noreply.github.com"
          git add -A && git commit -qm "Install test reports"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" install-test-reports
