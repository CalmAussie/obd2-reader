name: Install test

# Checks that the APK people download installs and runs on a clean phone, with nothing else
# needed: it downloads the latest release exactly as a user would, installs it on fresh
# emulators from Android 10 to 16 (and 17, experimental), opens it, starts the demo car and visits every tab.
# Runs after every release, and on demand from the Actions tab or a push to the qa branch.
on:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [qa]
    paths-ignore: ["qa-reports/**"]

# Read-only by default; only the job that pushes the reports branch can write.
permissions:
  contents: read

jobs:
  install:
    # After a build, only a release from a push to main counts: the branch filter above matches
    # the branch's name, which a pull request from someone else's fork could also call "main".
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental == true }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        api: [29, 33, 35, 36, 37]
        include:
          # Android 17's image is named "android-37.0", and its x86_64 image uses 16 KB memory pages.
          # Experimental: on GitHub's servers the Android 17 emulator's display crashes before any
          # app can open (tried SwiftShader, ANGLE and guest graphics, 16 KB and Play Store images),
          # so this job runs but doesn't fail a release. Tested on a real Android 17 phone instead.
          - api: 37
            level: "37.0"
            target: google_apis_ps16k
            experimental: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Download the published APK, as a user would
        run: |
          curl -fsSL -o OBD2Reader.apk https://github.com/${{ github.repository }}/releases/latest/download/OBD2Reader.apk
          ls -l OBD2Reader.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install and run on Android API ${{ matrix.api }}
        # A normal run takes about 45 minutes. Android 17's emulator sometimes hangs instead of failing,
        # which would hold up the reports from every other phone, so it gets a shorter limit. The limit
        # is on this step, not the job, so running out counts as that job failing (which Android 17 is
        # allowed to do) rather than cancelling the whole run.
        timeout-minutes: ${{ matrix.experimental && 20 || 90 }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.level || matrix.api }}
          target: ${{ matrix.target || 'google_apis' }}
          arch: x86_64
          profile: pixel_6
          # Newer system images leave too little room for apps on the default disk.
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.gpu || 'swiftshader_indirect' }} -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/install-test.sh ${{ matrix.api }}
      - name: Summary
        if: always()
        run: |
          echo "### Android API ${{ matrix.api }}" >> "$GITHUB_STEP_SUMMARY"
          cat reports/api-${{ matrix.api }}/result.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no result" >> "$GITHUB_STEP_SUMMARY"
          while read -r line; do echo "::notice title=API ${{ matrix.api }}::$line"; done < reports/api-${{ matrix.api }}/result.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: install-test-api-${{ matrix.api }}
          path: reports/

  # Screenshots and results go to the install-test-reports branch, so they can be looked at without signing in.
  publish:
    needs: install
    if: always() && needs.install.result != 'skipped'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: reports
          merge-multiple: true
      - name: Commit reports
        run: |
          cd reports
          git init -q && git checkout -q -b install-test-reports
          git config user.name "install-test-bot"; git config user.email "install-test-bot@users.noreply.github.com"
          git add -A && git commit -qm "Install test reports"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" install-test-reports
