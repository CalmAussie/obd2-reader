name: Install test

# Checks that the APK people download installs and runs on a clean phone, with nothing else
# needed: it downloads the release exactly as a user would, installs it on fresh emulators from
# Android 10 to 16 (and 17, experimental, only when asked), opens it, starts the demo car and
# visits every tab. Runs after every release, and on demand from the Actions tab or a push to the
# qa branch.
#
# A new release is published as a pre-release, which phones aren't offered. When its install test
# passes, the promote job below makes it the latest release, so phones are offered it; when the
# test fails, it stays a pre-release. See docs/RELEASING.md.
#
# Only the smoke checks (installs, opens, demo car connects, tabs, codes, report, updates, keeps
# running) fail a phone's job; the rest of the tour is reported as warnings. See the end of
# .github/scripts/install-test.sh.
on:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      android17:
        description: "Also try Android 17 (experimental: its emulator usually crashes on GitHub's servers)"
        type: boolean
        default: false
  push:
    branches: [qa]
    paths-ignore: ["qa-reports/**"]

# Read-only by default; only the job that pushes the reports branch can write.
permissions:
  contents: read

jobs:
  # Which release to test. After a build, the pre-release that build published; a push that
  # didn't raise the version isn't released, so there's nothing new to test. Started by hand or
  # from qa, the latest (live) release.
  release:
    # After a build, only a release from a push to main counts: the branch filter above matches
    # the branch's name, which a pull request from someone else's fork could also call "main".
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.which.outputs.tag }}
      prerelease: ${{ steps.which.outputs.prerelease }}
    steps:
      - name: Find the release
        id: which
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.event.workflow_run.run_number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            # The release this build published (its tag ends in -build<run number>), live or not.
            FOUND=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
              --jq "[.[] | select(.draft | not) | select(.tag_name | endswith(\"-build$BUILD\"))][0] | if . == null then \"\" else \"\(.tag_name) \(.prerelease)\" end") || exit 1
            TAG=${FOUND% *}; PRE=${FOUND#* }
            if [ -z "$FOUND" ]; then
              echo "::notice title=Nothing to test::Build $BUILD didn't publish a release, so there's nothing new to install."
              TAG=""; PRE=false
            fi
          else
            TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name) || exit 1
            PRE=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

  install:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.api == 37 }}
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix:
        # Android 17 (API 37) only when started by hand with "Also try Android 17" ticked.
        # Experimental: on GitHub's servers the Android 17 emulator's display crashes before any
        # app can open (tried SwiftShader, ANGLE and guest graphics, 16 KB and Play Store images),
        # so it failed every release run; it never fails the run. Tested on a real Android 17 phone instead.
        # Its image is named "android-37.0", and its x86_64 image uses 16 KB memory pages (set below).
        api: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.android17 && '[29, 33, 35, 36, 37]' || '[29, 33, 35, 36]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact release this run is for, so a newer release published meanwhile isn't tested twice.
      - name: Download the published APK, as a user would
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          echo "Testing $TAG"
          curl -fsSL -o OBD2Reader.apk "https://github.com/${{ github.repository }}/releases/download/$TAG/OBD2Reader.apk"
          ls -l OBD2Reader.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install and run on Android API ${{ matrix.api }}
        # A normal run takes 45 to 90 minutes (Android 10 is the slowest, so the limit is 120). Android 17's emulator sometimes hangs instead of failing,
        # which would hold up the reports from every other phone, so it gets a shorter limit. The limit
        # is on this step, not the job, so running out counts as that job failing (which Android 17 is
        # allowed to do) rather than cancelling the whole run.
        timeout-minutes: ${{ matrix.api == 37 && 20 || 120 }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api == 37 && '37.0' || matrix.api }}
          target: ${{ matrix.api == 37 && 'google_apis_ps16k' || 'google_apis' }}
          arch: x86_64
          profile: pixel_6
          # Newer system images leave too little room for apps on the default disk.
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/install-test.sh ${{ matrix.api }}
      - name: Summary
        if: always()
        run: |
          echo "### Android API ${{ matrix.api }}" >> "$GITHUB_STEP_SUMMARY"
          cat reports/api-${{ matrix.api }}/result.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no result" >> "$GITHUB_STEP_SUMMARY"
          # GitHub shows only the first 10 annotations of each kind per step, so only failures get one.
          grep ": FAILED" reports/api-${{ matrix.api }}/result.txt 2>/dev/null | head -10 | while read -r line; do echo "::warning title=API ${{ matrix.api }}::$line"; done || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: install-test-api-${{ matrix.api }}
          path: reports/

  # Screenshots and results go to the install-test-reports branch, so they can be looked at without signing in.
  # Only runs for main (releases and runs started from main) and the qa branch, so a test run of
  # another branch can't replace the reports of the latest release.
  publish:
    needs: install
    if: always() && needs.install.result != 'skipped' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qa')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: reports
          merge-multiple: true
      - name: Commit reports
        run: |
          cd reports
          git init -q && git checkout -q -b install-test-reports
          git config user.name "install-test-bot"; git config user.email "install-test-bot@users.noreply.github.com"
          git add -A && git commit -qm "Install test reports"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" install-test-reports

  # Makes a release that passed its install test the latest release, so every installed copy is
  # offered it. Only for a pre-release that a build on main published (not for a test started by
  # hand), and only when every phone's smoke checks passed. When they didn't, the release stays a
  # pre-release and this job fails, so the run shows it wasn't made live.
  promote:
    needs: [release, install]
    if: always() && github.event_name == 'workflow_run' && needs.release.outputs.prerelease == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # only the script is needed; gh gets the token itself
      - name: Make it the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          TESTED: ${{ needs.install.result }}
        run: |
          if [ "$TESTED" != success ]; then
            echo "::error title=Not made live::$TAG failed its install test ($TESTED), so it stays a pre-release and phones aren't offered it. See docs/RELEASING.md."
            exit 1
          fi
          # Only if nothing newer has been released meanwhile: the newest release, live or not, must be this one.
          NEWEST=$(bash .github/scripts/newest-release.sh) || exit 1
          if [ "$NEWEST" != "$TAG" ]; then
            echo "::warning title=Not made live::$TAG passed, but $NEWEST is newer, so $TAG isn't made the latest release."
            exit 0
          fi
          # A release taken back after going live is renamed "Withdrawn ..." (docs/RELEASING.md), so
          # re-running its old install test can't make it live again.
          read -r ID NAME < <(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '"\(.id) \(.name)"') || exit 1
          case "$NAME" in Withdrawn*)
            echo "::error title=Not made live::$TAG is marked withdrawn ($NAME), so it isn't made the latest release."; exit 1 ;;
          esac
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F prerelease=false -f make_latest=true --jq '"\(.tag_name): prerelease \(.prerelease)"'
          LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [ "$LATEST" = "$TAG" ] || { echo "::error::$TAG was edited but the latest release is $LATEST."; exit 1; }
          echo "::notice title=Live::$TAG passed its install test and is now the latest release, so phones are offered it."
