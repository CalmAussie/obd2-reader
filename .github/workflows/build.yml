name: Build APK

on:
  push:
    branches: [main, master]
    # Docs, the preview and test-only files don't change the app, so they don't make a release.
    paths-ignore: ["**.md", "preview/**", "docs/**", ".github/scripts/**", ".github/workflows/install-test.yml", ".github/workflows/qa.yml", ".github/dependabot.yml"]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the release job below can write (to publish the release).
permissions:
  contents: read

# Third-party actions are pinned to a full commit, not a tag that could be moved to other code.
# Dependabot (.github/dependabot.yml) offers updates to these pins as pull requests.

jobs:
  # Every push and pull request: unit tests and a test build. This job never sees the signing key,
  # so nothing here can sign or publish anything.
  build:
    # Pinned: this image ships with the Android SDK preinstalled (ubuntu-latest moved to Ubuntu 26).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Check the Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.7"
          # Open-source (MIT) caching. The default "enhanced" provider is a
          # closed-source component under separate Gradle terms of use.
          cache-provider: basic

      - name: Run unit tests
        run: |
          gradle --no-daemon testDebugUnitTest 2>&1 | tee -a build.log
          exit ${PIPESTATUS[0]}

      # Without the key this is signed with a throwaway key: it proves the release build works,
      # and it's kept as a download for testing, but it's never published.
      - name: Build the APK (test signing)
        run: |
          gradle --no-daemon assembleRelease 2>&1 | tee -a build.log
          exit ${PIPESTATUS[0]}

      - name: Check the APK is installable
        run: |
          cp app/build/outputs/apk/release/app-release.apk OBD2Reader-test.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          if "$AAPT" dump badging OBD2Reader-test.apk | grep -q "testOnly"; then
            echo "::error::APK is marked test-only and won't install from a file."; exit 1
          fi
          "$AAPT" dump badging OBD2Reader-test.apk | head -3

      # Puts compiler errors and failed tests on the run's summary page, so they're readable
      # without downloading the full log.
      - name: Report build errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -E "^e: |error:|ERROR:|FAILED|Exception|expected:<|What went wrong" build.log \
            | grep -v "^> Task" | awk '!seen[$0]++' | head -45 \
            | sed -e 's#file:///home/runner/work/obd2-reader/obd2-reader/##' -e 's/^/::error::/'
          grep -A6 "What went wrong" build.log | head -20 | tr '\n' ' ' | sed 's/^/::error::/' ; echo

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OBD2Reader-test-apk
          path: OBD2Reader-test.apk

  # Whether this build is a new version that can be released (see .github/scripts/release-check.sh).
  # A push that doesn't raise obdVersion isn't released, so no approval is asked for; a version
  # that went backwards, or a missing CHANGELOG entry, fails here. On pull requests it only reports.
  check:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Is this a new version?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^obdVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          CHANGELOG=$(grep -m1 -oE '^## [0-9][0-9.]*' CHANGELOG.md | cut -c4-)
          # The newest release, counting pre-releases (one waiting for its install test, or one that
          # failed it), so a version or build number is never used twice. No release at all is fine.
          TAG=$(bash .github/scripts/newest-release.sh) || exit 1
          bash .github/scripts/release-check.sh "$VERSION" "$CHANGELOG" "$TAG" "${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  # Signs and publishes a release. It runs only for main, only for a new version (the check job
  # above), and only after the "release" environment's required reviewer approves it on the run's
  # page. The signing key lives only in that environment's secrets, so no other job, branch or
  # pull request can use it.
  #
  # It's published as a pre-release, which the app's update check and the "latest" download link
  # don't see. The install test (install-test.yml) then installs this exact release, and only if
  # it passes is it made the latest release, which every installed copy is offered.
  release:
    needs: [build, check]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && needs.check.outputs.publish == 'true'
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The same check as the check job, again just before signing: approval can come hours later,
      # or this job can be re-run on an old run, by which time a newer build may have been released.
      - name: Is this still the newest build?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^obdVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          CHANGELOG=$(grep -m1 -oE '^## [0-9][0-9.]*' CHANGELOG.md | cut -c4-)
          TAG=$(bash .github/scripts/newest-release.sh) || exit 1
          OUT=$(bash .github/scripts/release-check.sh "$VERSION" "$CHANGELOG" "$TAG" "${{ github.run_number }}") || exit 1
          if [ "$OUT" != "publish=true" ]; then
            echo "::error::$TAG was published since this build was checked, so build ${{ github.run_number }} isn't released. Raise obdVersion to release again."; exit 1
          fi

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      # No shared build cache here: the job that holds the key builds from a clean start.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.7"
          # Open-source (MIT) caching. The default "enhanced" provider is a
          # closed-source component under separate Gradle terms of use.
          cache-provider: basic
          cache-disabled: true

      # The same signing key must be used for every build, or phones refuse to install an update
      # over an older version. Without it, stop: a release signed with any other key can't be installed.
      - name: Set up the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OBD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The OBD_KEYSTORE_BASE64 secret isn't set in the release environment, so nothing is published. See README, For developers."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "OBD_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # This job downloads every library fresh, so Maven Central can answer "429 Too Many
      # Requests" (it did for 2.5.7). Gradle waits and asks again up to 6 times (5, 10, 20, 40,
      # 80 s apart); if downloads still fail, the whole build is tried twice more, 2 minutes apart.
      # A failure that isn't about downloading stops at once.
      - name: Build the signed APK
        env:
          OBD_KEYSTORE_PASSWORD: ${{ secrets.OBD_KEYSTORE_PASSWORD }}
          OBD_KEY_ALIAS: ${{ secrets.OBD_KEY_ALIAS }}
          OBD_KEY_PASSWORD: ${{ secrets.OBD_KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.internal.repository.max.tentatives=6 -Dorg.gradle.internal.repository.initial.backoff=5000
        run: |
          # The exit code is caught directly (not through a pipe), so this works the same
          # whether or not the shell has pipefail on.
          for try in 1 2 3; do
            rc=0
            gradle --no-daemon assembleRelease > release-build.log 2>&1 || rc=$?
            cat release-build.log
            [ "$rc" = 0 ] && exit 0
            grep -qE "status code (429|5[0-9][0-9])|Could not (GET|HEAD|resolve|download)|Read timed out|Connection reset" release-build.log || exit 1
            [ $try = 3 ] && exit 1
            echo "::warning::Library downloads failed (try $try of 3); trying again in 2 minutes."
            sleep 120
          done

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # The certificate every release must carry (also in the README, so anyone can check their download).
      # Since 2.5.0: the key behind the earlier certificate was lost, so releases moved to a new one.
      - name: Check the APK is signed with the release key and installable
        env:
          EXPECTED_CERT_SHA256: 67eb2dd363dd994f7fe4b3a747564d2c2ccb52e5ad4953c3391bd24e412d04c2
        run: |
          cp app/build/outputs/apk/release/app-release.apk OBD2Reader.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          CERTS=$("$APKSIGNER" verify --verbose --print-certs OBD2Reader.apk)
          echo "$CERTS"
          if ! echo "$CERTS" | grep -q "certificate SHA-256 digest: $EXPECTED_CERT_SHA256"; then
            echo "::error::The APK isn't signed with the release certificate, so it isn't published."; exit 1
          fi
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          if "$AAPT" dump badging OBD2Reader.apk | grep -q "testOnly"; then
            echo "::error::APK is marked test-only and won't install from a file."; exit 1
          fi
          sha256sum OBD2Reader.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OBD2Reader-apk
          path: OBD2Reader.apk

      # Release notes: the newest CHANGELOG.md entry, then how to install.
      - name: Write release notes
        run: |
          VERSION=$(grep '^obdVersion=' gradle.properties | cut -d= -f2)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          {
            echo "## What's new"
            awk '/^## /{n++} n==1 && !/^## /{print} n==2{exit}' CHANGELOG.md
            echo
            cat .github/release-notes.md
          } > release-body.md

      # Published as a pre-release: phones aren't offered it, and the "latest" download link
      # (https://github.com/<you>/<repo>/releases/latest/download/OBD2Reader.apk) still gives the
      # previous version, until the install test passes and makes this the latest release.
      - name: Publish a pre-release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ env.APP_VERSION }}-build${{ github.run_number }}
          name: OBD2 Reader ${{ env.APP_VERSION }} (build ${{ github.run_number }})
          body_path: release-body.md
          files: OBD2Reader.apk
          prerelease: true
          make_latest: false
