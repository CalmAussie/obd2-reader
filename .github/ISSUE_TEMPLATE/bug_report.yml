name: Report a problem
description: Something in OBD2 Reader isn't working as it should.
title: "[Bug] "
labels: ["bug"]
projects: ["CalmAussie/1"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more detail you give, the quicker it can be fixed.
        **Please don't include your VIN, number plate or anything else personal.**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect to happen instead?
      placeholder: "When I tap Read codes, the app says \"No answer\" even though the check-engine light is on."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be repeated?
      description: The steps that lead to the problem, if you know them.
      placeholder: |
        1. Connect to the adapter
        2. Open Diagnostics
        3. Tap Read codes
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: App version
      description: Diagnostics → App updates shows it (the app fills this in when you report from inside it).
      placeholder: "1.27.0"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: "Samsung Galaxy S23+, Android 16"
    validations:
      required: true
  - type: input
    id: car
    attributes:
      label: Car (make, model, year and engine)
      placeholder: "Mazda Tribute 2006, 2.3 I4"
    validations:
      required: false
  - type: dropdown
    id: adapter
    attributes:
      label: Adapter connection
      options:
        - Bluetooth
        - Bluetooth LE
        - Wi-Fi
        - Demo car (no adapter)
        - Not sure
    validations:
      required: false
  - type: input
    id: adapter_name
    attributes:
      label: Adapter name or model
      placeholder: "Vgate iCar Pro, generic ELM327 v1.5…"
    validations:
      required: false
  - type: checkboxes
    id: where
    attributes:
      label: Where did it happen?
      options:
        - label: On the phone
        - label: In Android Auto
        - label: In the home-screen widget or picture-in-picture
  - type: textarea
    id: log
    attributes:
      label: Adapter log (optional)
      description: |
        Diagnostics → Adapter log → Save or share, then paste it here. It helps a lot with connection and reading problems.
        **The log can include your car's VIN: delete that line before pasting.**
      render: text
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or a screen recording (optional)
      description: Drag images or a video in here.
    validations:
      required: false
